<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true">
<f:if condition="{pagination.numberOfPages} > 1">
    <nav class="mb-3">
        <ul class="pagination">
            <f:if condition="{pagination.hasLessPages}">
                <f:then>
                    <li class="page-item">
                        <a class="page-link" href="{f:be.uri(route: 'site_riddle', parameters: {type: demand.type, id: demand.id, page: 1})}">
                            <core:icon identifier="actions-view-paging-first" />
                        </a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="{f:be.uri(route: 'site_riddle', parameters: {type: demand.type, id: demand.id, page: pagination.previousPage})}">
                            <core:icon identifier="actions-view-paging-previous" />
                        </a>
                    </li>
                </f:then>
                <f:else>
                    <li class="page-item disabled"><span class="page-link"><core:icon identifier="actions-view-paging-first" /></span></li>
                    <li class="page-item disabled"><span class="page-link"><core:icon identifier="actions-view-paging-previous" /></span></li>
                </f:else>
            </f:if>
            <li class="page-item disabled">
                <span class="page-link">
                    {pagination.startRecord} - {pagination.endRecord} ({pagination.current} / {pagination.numberOfPages})
                </span>
            </li>
            <f:if condition="{pagination.hasMorePages}">
                <f:then>
                    <li class="page-item">
                        <a class="page-link" href="{f:be.uri(route: 'site_riddle', parameters: {type: demand.type, id: demand.id, page: pagination.nextPage})}">
                            <core:icon identifier="actions-view-paging-next" />
                        </a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="{f:be.uri(route: 'site_riddle', parameters: {type: demand.type, id: demand.id, page: pagination.numberOfPages})}">
                            <core:icon identifier="actions-view-paging-last" />
                        </a>
                    </li>
                </f:then>
                <f:else>
                    <li class="page-item disabled"><span class="page-link"><core:icon identifier="actions-view-paging-next" /></span></li>
                    <li class="page-item disabled"><span class="page-link"><core:icon identifier="actions-view-paging-last" /></span></li>
                </f:else>
            </f:if>
        </ul>
    </nav>
</f:if>
</html>
