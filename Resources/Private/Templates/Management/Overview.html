<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="LLL:EXT:riddle/Resources/Private/Language/locallang.xlf:module.title" /></h1>

    <f:render section="filter" arguments="{_all}" />

    <f:if condition="{riddles}">
        <f:then>
            <f:render section="table" arguments="{_all}" />
        </f:then>
        <f:else>
            <f:be.infobox state="-1" title="{f:translate(key: 'LLL:EXT:riddle/Resources/Private/Language/locallang.xlf:module.noEntries')}" />
        </f:else>
    </f:if>
</f:section>

<f:section name="table">
    <f:render partial="Pagination" arguments="{_all}" />
    <div class="table-fit">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th><f:translate key="LLL:EXT:riddle/Resources/Private/Language/locallang.xlf:module.column.date" /></th>
                    <th><f:translate key="LLL:EXT:riddle/Resources/Private/Language/locallang.xlf:riddle.type" /></th>
                    <th><f:translate key="LLL:EXT:riddle/Resources/Private/Language/locallang.xlf:tx_riddle_log.riddle_title" /></th>
                    <th><f:translate key="LLL:EXT:riddle/Resources/Private/Language/locallang.xlf:module.column.lead" /></th>
                    <th><f:translate key="LLL:EXT:riddle/Resources/Private/Language/locallang.xlf:tx_riddle_log.result" /></th>
                </tr>
            </thead>
            <tbody>
                <f:for each="{riddles}" as="riddle">
                    <tr>
                        <td>{riddle.crdate -> f:format.date(format: 'd.m.Y H:i')}</td>
                        <td>{riddle.riddle_type}</td>
                        <td>{riddle.riddle_title -> f:format.stripTags()}</td>
                        <td>{riddle.lead_name} <f:if condition="{riddle.lead_email}">({riddle.lead_email})</f:if></td>
                        <td>{riddle.result_score_percentage}</td>
                    </tr>
                </f:for>
            </tbody>
        </table>
    </div>
    <f:render partial="Pagination" arguments="{_all}" />
</f:section>

<f:section name="filter">
    <form action="{f:be.uri(route: 'site_riddle')}" method="post" name="demand" class="row row-cols-auto g-3 align-items-end mb-3">
        <div class="col">
            <label for="demand-type" class="form-label"><f:translate key="LLL:EXT:riddle/Resources/Private/Language/locallang.xlf:riddle.type" /></label>
            <select id="demand-type" class="form-select form-select-sm" name="type">
                <option value=""></option>
                <f:for each="{filter.type}" as="singleType">
                    <f:if condition="{singleType} == {demand.type}">
                        <f:then><option value="{singleType}" selected="selected">{singleType}</option></f:then>
                        <f:else><option value="{singleType}">{singleType}</option></f:else>
                    </f:if>
                </f:for>
            </select>
        </div>
        <div class="col">
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="demand-export" name="export" value="1" />
                <label class="form-check-label" for="demand-export"><f:translate key="LLL:EXT:riddle/Resources/Private/Language/locallang.xlf:module.export" /></label>
            </div>
        </div>
        <div class="col">
            <button type="submit" class="btn btn-default btn-sm"><f:translate key="LLL:EXT:riddle/Resources/Private/Language/locallang.xlf:module.filter" /></button>
        </div>
    </form>
</f:section>
</html>
